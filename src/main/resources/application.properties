spring.application.name=goat-backend
# Conexión a PostgreSQL

# datasource.url le dice a Spring dónde está DDBB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/goat}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}

# JPA / Hibernate (mira  clases Java y crea/actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update

# show-sql true muestra en consola las queries que ejecuta
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor
server.port=8080

# Football Data API
football.api.key=${FOOTBALL_API_KEY:697f4d8cbfc54c48b6024ea1f2490c4a}
football.api.url=https://api.football-data.org/v4